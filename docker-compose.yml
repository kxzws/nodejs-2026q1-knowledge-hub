services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-hub-api
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy # waiting for db to be ready
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    env_file:
      - .env
    networks:
      - kh_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-4000}/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kh_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    profiles: ["debug"] # starting with --profile debug
    ports:
      - "8080:8080"
    networks:
      - kh_network
    restart: unless-stopped

networks:
  kh_network:
    driver: bridge

volumes:
  pgdata:
    name: kh_postgres_persistence
